<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLux - Register Profile</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/registration.js" defer></script>
</head>
<body>
  <main class="box">
    <h2>Join ChronoLux</h2>
    <p class="sub-label">Create your collector profile</p>
    <form id="registerForm">
      <input type="text" id="fullName" placeholder="Full Name" minlength="2" maxlength="80" autocomplete="name" required>
      <input type="email" id="email" placeholder="Email Address" maxlength="254" autocomplete="email" required>
      <input type="tel" id="phone" placeholder="10 Digit Mobile Number" pattern="[0-9]{10}" maxlength="10" autocomplete="tel" required>
      <input type="password" id="password" placeholder="Create Password (8+ characters)" minlength="8" autocomplete="new-password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password" minlength="8" autocomplete="new-password" required>
      <button type="submit" id="registerButton">Create My Account</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p class="toggle-note">Already registered? <a class="link-text" href="/login.html">Login here</a></p>
  </main>
</body>
</html>
