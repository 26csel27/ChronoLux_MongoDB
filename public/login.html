<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLux - Collector Login</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="box">
    <h2>ChronoLux</h2>
    <p class="sub-label">Collector Login · Welcome back</p>
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email Address" autocomplete="username" maxlength="254" required>
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="loginButton">Access Secure Vault</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <p class="toggle-note">New here? <a class="link-text" href="/registration.html">Register profile</a></p>
  </main>
</body>
</html>
